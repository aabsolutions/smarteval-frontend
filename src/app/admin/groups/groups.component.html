<section class="content">
  <div class="content-block">
    <div class="block-header" *ngFor="let breadscrum of breadscrums">
      <app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active"></app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Gestión de Grupos</h2>
                </li>
                <li class="tbl-search-box">
                  <label for="search-input"><i class="material-icons search-icon">search</i></label>
                  <input placeholder="Buscar" type="text" (keyup)="applyFilter($event)" class="browser-default search-field" aria-label="Caja de búsqueda">
                </li>
              </ul>
            </div>
            <div class="right">
              <ul class="tbl-export-btn">
                <li class="tbl-header-btn">
                  <div class="m-l-10">
                    <app-table-show-hide-column [columnDefinitions]="columnDefinitions"></app-table-show-hide-column>
                  </div>
                </li>
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="AGREGAR">
                    <button mat-mini-fab color="primary" (click)="openGroupDialog()">
                      <mat-icon class="col-white">add</mat-icon>
                    </button>
                  </div>
                </li>
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="ACTUALIZAR">
                    <button mat-mini-fab color="primary" (click)="loadGroups()">
                      <mat-icon class="col-white">refresh</mat-icon>
                    </button>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="body overflow-auto">
            <div class="responsive_table">
              <table mat-table [dataSource]="dataSource" matSort class="mat-cell advance-table">
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Nombre </th>
                  <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>

                <!-- Institution Column -->
                <ng-container matColumnDef="institution">
                  <th mat-header-cell *matHeaderCellDef> Institución </th>
                  <td mat-cell *matCellDef="let row"> {{row.institution?.name || 'N/A'}} </td>
                </ng-container>

                <!-- Jornada Column -->
                <ng-container matColumnDef="jornada">
                  <th mat-header-cell *matHeaderCellDef> Jornada </th>
                  <td mat-cell *matCellDef="let row"> {{row.jornada}} </td>
                </ng-container>

                <!-- Nivel Column -->
                <ng-container matColumnDef="nivel">
                  <th mat-header-cell *matHeaderCellDef> Nivel </th>
                  <td mat-cell *matCellDef="let row"> {{row.nivel}} </td>
                </ng-container>

                <!-- Teacher Column -->
                <ng-container matColumnDef="teacher">
                  <th mat-header-cell *matHeaderCellDef> Docente </th>
                  <td mat-cell *matCellDef="let row"> {{row.teacher?.name || 'Sin Asignar'}} </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let row" class="pr-0">
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="openGroupDialog(row)" class="tbl-action-btn" matTooltip="Editar">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="deleteGroup(row)" class="tbl-action-btn" matTooltip="Eliminar">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'"></app-feather-icons>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
                <tr mat-row *matRowDef="let row; columns: getDisplayedColumns();" matRipple></tr>
              </table>
              <div *ngIf="dataSource.data.length === 0" class="no-results">
                No hay resultados
              </div>
              <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10"></mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
