<h2 mat-dialog-title>{{ isEdit ? 'Editar Institución' : 'Nueva Institución' }}</h2>
<mat-dialog-content>
  <form [formGroup]="institutionForm" class="pt-3">
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="institutionForm.get('name')?.hasError('required')">El nombre es requerido</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="institutionForm.invalid">Guardar</button>
</mat-dialog-actions>
