<section class="content">
  <div class="content-block">
    <div class="block-header" *ngFor="let breadscrum of breadscrums">
      <app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active"></app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Estudiantes</h2>
                </li>
                <li class="tbl-search-box">
                  <label for="search-input"><i class="material-icons search-icon">search</i></label>
                  <input placeholder="Buscar" type="text" (keyup)="applyFilter($event)" class="browser-default search-field" aria-label="Caja de búsqueda">
                </li>
              </ul>
            </div>
            <div class="right">
              <ul class="tbl-export-btn">
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="IMPORTAR DESDE EXCEL">
                    <button mat-mini-fab color="accent" (click)="openImportDialog()">
                      <mat-icon class="col-white">upload_file</mat-icon>
                    </button>
                  </div>
                </li>
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="AGREGAR">
                    <button mat-mini-fab color="primary" (click)="openStudentDialog()">
                      <mat-icon class="col-white">add</mat-icon>
                    </button>
                  </div>
                </li>
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="ACTUALIZAR">
                    <button mat-mini-fab color="primary" (click)="loadStudents()">
                      <mat-icon class="col-white">refresh</mat-icon>
                    </button>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="body overflow-auto">
            <div class="responsive_table">
              <table mat-table [dataSource]="dataSource" matSort class="mat-cell advance-table">
                
                <ng-container matColumnDef="identifier">
                  <th mat-header-cell *matHeaderCellDef> Cédula/Código </th>
                  <td mat-cell *matCellDef="let row"> {{row.identifier}} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Nombre Completo </th>
                  <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>

                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef> Correo </th>
                  <td mat-cell *matCellDef="let row"> {{row.email}} </td>
                </ng-container>

                <ng-container matColumnDef="group">
                  <th mat-header-cell *matHeaderCellDef> Grupo </th>
                  <td mat-cell *matCellDef="let row"> {{row.groupId?.name || 'N/A'}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let row" class="pr-0">
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="openStudentDialog(row)" class="tbl-action-btn" matTooltip="Editar">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="deleteStudent(row)" class="tbl-action-btn" matTooltip="Eliminar">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'"></app-feather-icons>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" matRipple></tr>
              </table>
              <div *ngIf="dataSource.data.length === 0" class="no-results">
                No hay resultados
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
