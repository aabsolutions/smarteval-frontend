<h2 mat-dialog-title>{{ isEdit ? 'Editar Docente' : 'Nuevo Docente' }}</h2>
<mat-dialog-content>
  <form [formGroup]="teacherForm" class="pt-3">
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Cédula / Identificador</mat-label>
      <input matInput formControlName="identifier" required />
      <mat-error *ngIf="teacherForm.get('identifier')?.hasError('required')">El identificador es requerido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="teacherForm.get('name')?.hasError('required')">El nombre es requerido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error *ngIf="teacherForm.get('email')?.hasError('email')">Formato inválido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="teacherForm.invalid">Guardar</button>
</mat-dialog-actions>
