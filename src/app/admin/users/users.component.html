<section class="content">
  <div class="content-block">
    @for (breadscrum of breadscrums; track breadscrum) {
    <div class="block-header">
      <app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active">
      </app-breadcrumb>
    </div>
    }

    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card users-card">
          <div class="header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h2>User Management</h2>

            <div class="header-actions d-flex align-items-center gap-3">
              <div class="search-box">
                <mat-icon class="search-icon">search</mat-icon>
                <input type="text" (keyup)="applyFilter($event)" placeholder="Search users..." class="search-input">
              </div>

              <app-table-show-hide-column [columnDefinitions]="columnDefinitions"></app-table-show-hide-column>

            <button mat-flat-button color="primary" class="add-user-btn" (click)="openUserDialog()">
              <mat-icon>person_add</mat-icon> Add New User
            </button>
            </div>
          </div>

          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="dataSource" class="mat-elevation-z0 w-100 modern-table">

                <!-- Avatar Column -->
                <ng-container matColumnDef="avatar">
                  <th mat-header-cell *matHeaderCellDef> Profile </th>
                  <td mat-cell *matCellDef="let user">
                    <img [src]="'assets/images/user/' + (user.avatar || 'new.jpg')" alt="Avatar" class="user-avatar"
                         onerror="this.onerror=null;this.src='assets/images/user/new.jpg';">
                  </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Name </th>
                  <td mat-cell *matCellDef="let user">
                    <div class="user-name" style="text-align: left;">{{user.name}}</div>
                  </td>
                </ng-container>

                <!-- Username Column -->
                <ng-container matColumnDef="username">
                  <th mat-header-cell *matHeaderCellDef> Username </th>
                  <td mat-cell *matCellDef="let user">
                    <div class="user-handle">@{{user.username}}</div>
                  </td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef> Email </th>
                  <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                </ng-container>

                <!-- Roles Column -->
                <ng-container matColumnDef="roles">
                  <th mat-header-cell *matHeaderCellDef> Roles </th>
                  <td mat-cell *matCellDef="let user">
                    <span class="role-badge" [ngClass]="'role-' + user.roles[0]?.name?.toLowerCase()">
                      {{user.roles[0]?.name}}
                    </span>
                  </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef class="text-right"> Actions </th>
                  <td mat-cell *matCellDef="let user" class="text-right">
                    <button mat-icon-button color="warn" matTooltip="Reset Password" class="action-btn reset-btn" (click)="resetPassword(user)">
                      <mat-icon>lock_reset</mat-icon>
                    </button>
                    <button mat-icon-button color="primary" matTooltip="Edit User" class="action-btn edit-btn" (click)="openUserDialog(user)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Delete User" class="action-btn delete-btn" (click)="deleteUser(user)">
                      <mat-icon>delete_outline</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
                <tr mat-row *matRowDef="let row; columns: getDisplayedColumns();" class="user-row"></tr>
              </table>

              @if (dataSource.data.length === 0) {
                <div class="no-data-msg">
                  <mat-icon class="no-data-icon">people_outline</mat-icon>
                  <p>No users found in the system.</p>
                </div>
              }

              <mat-paginator
                [length]="totalUsers"
                [pageSize]="pageSize"
                [pageSizeOptions]="[5, 10, 25, 100]"
                [pageIndex]="pageIndex"
                (page)="onPageChange($event)"
                aria-label="Select page">
              </mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
