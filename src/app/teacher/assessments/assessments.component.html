<section class="content">
  <div class="content-block">
    <div class="block-header" *ngFor="let breadscrum of breadscrums">
      <app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active"></app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Exámenes</h2>
                </li>
                <li class="tbl-search-box">
                  <label for="search-input"><i class="material-icons search-icon">search</i></label>
                  <input placeholder="Buscar" type="text" (keyup)="applyFilter($event)" class="browser-default search-field" aria-label="Caja de búsqueda">
                </li>
              </ul>
            </div>
            <div class="right">
              <ul class="tbl-export-btn">
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="NUEVO EXAMEN">
                    <button mat-mini-fab color="primary" (click)="openAssessmentDialog()">
                      <mat-icon class="col-white">add</mat-icon>
                    </button>
                  </div>
                </li>
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="ACTUALIZAR">
                    <button mat-mini-fab color="primary" (click)="loadAssessments()">
                      <mat-icon class="col-white">refresh</mat-icon>
                    </button>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="body overflow-auto">
            <div class="responsive_table">
              <table mat-table [dataSource]="dataSource" matSort class="mat-cell advance-table">
                <ng-container matColumnDef="title">
                  <th mat-header-cell *matHeaderCellDef> Título </th>
                  <td mat-cell *matCellDef="let row"> 
                    {{row.title}} 
                    <span *ngIf="row.isSimulator" class="badge badge-solid-orange ms-2">Simulador</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="topic">
                  <th mat-header-cell *matHeaderCellDef> Tema </th>
                  <td mat-cell *matCellDef="let row"> {{row.topicId?.name}} </td>
                </ng-container>

                <ng-container matColumnDef="groups">
                  <th mat-header-cell *matHeaderCellDef> Grupos </th>
                  <td mat-cell *matCellDef="let row"> 
                    <span class="badge badge-solid-blue me-1" *ngFor="let g of row.groupIds">{{g.name || 'Sin nombre'}}</span>
                    <span class="text-muted small" *ngIf="!row.groupIds || row.groupIds.length === 0">Sin grupos asignados</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="startTime">
                  <th mat-header-cell *matHeaderCellDef> Inicio </th>
                  <td mat-cell *matCellDef="let row"> {{row.startTime | date:'short'}} </td>
                </ng-container>

                <ng-container matColumnDef="endTime">
                  <th mat-header-cell *matHeaderCellDef> Fin </th>
                  <td mat-cell *matCellDef="let row"> {{row.endTime | date:'short'}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let row" class="pr-0">
                    <button mat-icon-button color="primary" (click)="$event.stopPropagation()" (click)="openAssessmentDialog(row)" class="tbl-action-btn" matTooltip="Editar">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="primary" [routerLink]="['/teacher/assessments', row._id, 'results']" class="tbl-action-btn ms-2" matTooltip="Ver Resultados">
                      <app-feather-icons [icon]="'pie-chart'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="deleteAssessment(row)" class="tbl-action-btn ms-2" matTooltip="Eliminar">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="primary" *ngIf="!row.isSimulator" (click)="$event.stopPropagation()" (click)="openPrintDialog(row)" class="tbl-action-btn ms-2" matTooltip="Generar Prueba Escrita">
                      <app-feather-icons [icon]="'printer'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" matRipple></tr>
              </table>
              <div *ngIf="dataSource.data.length === 0" class="no-results">
                No hay exámenes
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
