<section class="content">
  <div class="content-block">
    <div class="block-header" *ngFor="let breadscrum of breadscrums">
      <app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active"></app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Mis Grupos Asignados</h2>
                </li>
              </ul>
            </div>
          </div>
          <div class="body overflow-auto">
            <div class="responsive_table">
              <table mat-table [dataSource]="dataSource" matSort class="mat-cell advance-table">
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Nombre </th>
                  <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>

                <!-- Institution Column -->
                <ng-container matColumnDef="institution">
                  <th mat-header-cell *matHeaderCellDef> Institución </th>
                  <td mat-cell *matCellDef="let row"> {{row.institution?.name || 'N/A'}} </td>
                </ng-container>

                <!-- Jornada Column -->
                <ng-container matColumnDef="jornada">
                  <th mat-header-cell *matHeaderCellDef> Jornada </th>
                  <td mat-cell *matCellDef="let row"> {{row.jornada}} </td>
                </ng-container>

                <!-- Nivel Column -->
                <ng-container matColumnDef="nivel">
                  <th mat-header-cell *matHeaderCellDef> Nivel </th>
                  <td mat-cell *matCellDef="let row"> {{row.nivel}} </td>
                </ng-container>

                <!-- Students Column -->
                <ng-container matColumnDef="students">
                  <th mat-header-cell *matHeaderCellDef> Estudiantes </th>
                  <td mat-cell *matCellDef="let row">
                    <span class="badge badge-solid-blue me-2">{{ row.students?.length || 0 }}</span>
                    <button mat-icon-button color="primary" matTooltip="Ver Nómina" (click)="openStudentRoster(row)" *ngIf="row.students?.length">
                      <mat-icon>list</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" matRipple></tr>
              </table>
              <div *ngIf="dataSource.data.length === 0" class="no-results">
                Aún no tienes grupos asignados.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<ng-template #studentsDialog let-data>
  <h2 mat-dialog-title>Nómina de Estudiantes - {{data.name}}</h2>
  <mat-dialog-content>
    <div style="max-height: 400px; overflow-y: auto; padding-right: 1rem;">
      <ol style="margin: 1rem 0; padding-left: 2.5rem; list-style-type: decimal;">
        <li *ngFor="let student of data.students" style="padding: 6px 0; border-bottom: 1px solid #f0f0f0;">
          <span style="font-weight: 500;">{{student.name}}</span> 
          <small class="text-muted ms-2" *ngIf="student.email">({{student.email}})</small>
        </li>
      </ol>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close color="primary">Cerrar</button>
  </mat-dialog-actions>
</ng-template>
