<h2 mat-dialog-title>{{ isEdit ? 'Editar Tema' : 'Nuevo Tema' }}</h2>
<mat-dialog-content>
  <form [formGroup]="topicForm" class="pt-3">
    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Nombre del Tema</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="topicForm.get('name')?.hasError('required')">El nombre es requerido</mat-error>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="topicForm.invalid">Guardar</button>
</mat-dialog-actions>
